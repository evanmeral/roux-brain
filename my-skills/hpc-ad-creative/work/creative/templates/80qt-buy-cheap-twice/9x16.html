<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1920px}
.ad{background:var(--offwhite);padding:0}
/* Story safe zones: nothing above 250px or below 1580px. */
.top{position:absolute;left:0;right:0;top:0;height:1030px;padding:160px 80px 0;
  display:flex;flex-direction:column;justify-content:flex-start}
.logo{position:static;width:148px;margin-bottom:34px}
.eyebrow{color:var(--accent-dk);font-size:24px;margin-bottom:28px}
.hl{font-size:96px;color:var(--ink)}
.rule{margin:30px 0 26px;width:86px;height:5px}
.sub{font-size:30px;color:var(--muted);max-width:880px}
.cta{margin-top:36px;font-size:29px;align-self:flex-start}
.warranty{margin-top:20px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px;
  color:var(--muted);letter-spacing:.11em}
.bot{position:absolute;left:0;right:0;top:1030px;bottom:0;background:var(--ink);overflow:hidden}
.bot:after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;
  background:radial-gradient(88% 70% at 50% 62%,rgba(246,147,41,.42),transparent 68%)}
.stamp{position:absolute;top:40px;left:0;right:0;text-align:center;z-index:3;
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:25px;color:#fff;letter-spacing:.2em}
.stamp b{color:var(--accent)}
.pzone{position:absolute;left:0;right:0;top:100px;height:687px;z-index:2;
  display:flex;align-items:center;justify-content:center}
.shadow{filter:drop-shadow(0 30px 44px rgba(0,0,0,.5))}
</style></head>
<body><div class="ad">
  <div class="top">
    <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-Color.png">
    <div class="eyebrow">Cheap pots are expensive</div>
    <div class="hl">Buy the<br>cheap one<br>twice.</div>
    <div class="rule"></div>
    <div class="sub">Or buy 4mm aluminum once. Same reason you stopped buying styrofoam ice chests.</div>
    <div class="cta">See what lasts</div>
    <div class="warranty">5-YR LIMITED WARRANTY &middot; RESIDENTIAL &middot; 120 QT &amp; SMALLER</div>
  </div>
  <div class="bot">
    <div class="stamp">80 QT POWERED <b>&middot;</b> 4MM <b>&middot;</b> BUILT IN LOUISIANA</div>
    <div class="pzone"><div class="pbox shadow" style="width:624px;height:573px"><img src="../../../../assets/product-cutouts/80qt - pwd.png" style="width:673px;left:-27px;top:-197px"></div></div>
  </div>
</div></body></html>
