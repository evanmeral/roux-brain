<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1200px;height:628px}
.ad{background:var(--offwhite);padding:0}
.grid{display:grid;grid-template-columns:668px 1fr;height:100%}
.left{position:relative;padding:48px 34px 48px 52px;display:flex;flex-direction:column;justify-content:center}
.logo{width:112px;top:42px;left:52px}
.eyebrow{color:var(--accent-dk);font-size:17px;margin-bottom:18px;margin-top:56px}
.hl{font-size:62px;color:var(--ink)}
.rule{margin:22px 0 18px;width:64px}
.sub{font-size:20px;color:var(--muted);max-width:520px}
.cta{margin-top:26px;font-size:20px;align-self:flex-start}
.right{position:relative;background:var(--ink);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.right:after{content:"";position:absolute;inset:0;
  background:radial-gradient(92% 74% at 50% 110%,rgba(246,147,41,.42),transparent 62%)}
.shadow{z-index:2;filter:drop-shadow(0 26px 38px rgba(0,0,0,.5))}
.stamp{position:absolute;top:40px;left:0;right:0;text-align:center;z-index:3;
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:16px;color:#fff;letter-spacing:.18em}
.stamp b{color:var(--accent)}
.warranty{position:absolute;bottom:32px;left:0;right:0;text-align:center;z-index:3;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;
  color:rgba(255,255,255,.72);letter-spacing:.1em;line-height:1.7}
</style></head>
<body><div class="ad"><div class="grid">
  <div class="left">
    <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-Color.png">
    <div class="eyebrow">Cheap pots are expensive</div>
    <div class="hl">Buy the cheap<br>one twice.</div>
    <div class="rule"></div>
    <div class="sub">Or buy 4mm cast aluminum once. Same reason you stopped buying styrofoam ice chests.</div>
    <div class="cta">See what lasts</div>
  </div>
  <div class="right">
    <div class="stamp">4MM <b>&middot;</b> BUILT IN LOUISIANA</div>
    <div class="pbox shadow" style="width:414px;height:380px"><img src="../../../../assets/product-cutouts/80qt - pwd.png" style="width:445px;left:-18px;top:-131px"></div>
    <div class="warranty">80 QT POWERED COOKER<br>5-YR LIMITED &middot; RESIDENTIAL &middot; 120 QT &amp; SMALLER</div>
  </div>
</div></div></body></html>
