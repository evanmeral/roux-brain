<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1920px}
.ad{padding:250px 54px 0;display:flex;flex-direction:column}
.logo{width:150px;top:172px;right:54px}
.top{position:relative;z-index:4;flex:none}
.eyebrow{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:800;
  font-size:31px;letter-spacing:.14em}
.big{font-weight:900;font-size:200px;line-height:.78;letter-spacing:-.05em;margin-top:16px;
  background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.sw{font-weight:900;font-size:74px;color:#fff;letter-spacing:.01em;margin-top:6px}
.plus{display:inline-block;margin-top:20px;background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;
  padding:13px 26px;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:29px;letter-spacing:.04em}
.plus b{color:var(--accent)}
.glow{width:880px;height:470px;left:50px;bottom:560px;z-index:1}
.mid{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;z-index:2}
.shadow{filter:drop-shadow(0 32px 46px rgba(0,0,0,.6))}
.bar{position:relative;z-index:5;flex:none;background:var(--flame);color:#fff;border-radius:9px;
  padding:18px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:32px;
  letter-spacing:.06em;margin-bottom:16px}
.codes{position:relative;z-index:5;flex:none;display:flex;gap:14px;margin-bottom:22px}
.chip{flex:1;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.4);
  border-radius:9px;padding:18px 6px;text-align:center}
.chip .k{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:40px;color:#fff;letter-spacing:-.02em}
.chip .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:24px;color:var(--accent);
  letter-spacing:.05em;margin-top:10px}
.foot{position:relative;z-index:5;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding-bottom:300px;font-family:'JetBrains Mono',monospace;font-weight:800;letter-spacing:.06em}
.fb{font-size:26px;color:rgba(255,255,255,.62)}
.fd{font-size:32px;color:var(--accent)}
</style></head>
<body><div class="ad bg-dark">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="top">
    <div class="eyebrow">LABOR DAY SALE</div>
    <div class="big">10% OFF</div>
    <div class="sw">SITEWIDE</div>
    <div class="plus">PLUS <b>30% OFF</b> LEG EXTENSIONS</div>
  </div>
  <div class="glow"></div>
  <div class="mid"><div class="pbox shadow" style="width:406px;height:660px"><img src="../../../../assets/product-cutouts/18qt pwd on leg extensions.png" style="width:934px;left:-262px;top:-293px"></div></div>
  <div class="bar">USE BOTH CODES AT CHECKOUT</div>
  <div class="codes">
    <div class="chip"><div class="k">LABORDAY10-26</div><div class="v">10% OFF SITEWIDE</div></div>
    <div class="chip"><div class="k">LABORDAY30-LEGS</div><div class="v">30% OFF LEGS</div></div>
  </div>
  <div class="foot"><div class="fb">BUILT IN LOUISIANA</div><div class="fd">SEPT 1–8</div></div>
</div></body></html>
