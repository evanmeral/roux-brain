<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1920px}
.ad{padding:250px 54px 0;display:flex;flex-direction:column}
.logo{width:150px;top:172px;right:54px}
.top{position:relative;z-index:4;flex:none}
.eyebrow{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:800;
  font-size:31px;letter-spacing:.13em}
.big{font-weight:900;font-size:228px;line-height:.86;letter-spacing:-.05em;margin-top:10px;
  background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.sw{font-weight:900;font-size:65px;color:#fff;letter-spacing:-.01em;margin-top:2px}
.plus{display:table;margin-top:24px;background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;
  padding:14px 24px;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:27px;letter-spacing:.02em}
.plus b{color:var(--accent)}
.glow{width:960px;height:420px;left:60px;bottom:660px;z-index:1}
.mid{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;z-index:2;padding:34px 0 40px}
.shadow{filter:drop-shadow(0 32px 46px rgba(0,0,0,.6))}
.bar{position:relative;z-index:5;flex:none;background:var(--flame);color:#fff;border-radius:9px;
  padding:18px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:31px;
  letter-spacing:.05em;margin-bottom:16px}
.codes{position:relative;z-index:5;flex:none;display:flex;gap:14px;margin-bottom:16px}
.chip{flex:1;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.4);
  border-radius:9px;padding:18px 6px;text-align:center}
.chip .k{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:40px;color:#fff;letter-spacing:-.02em}
.chip .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:24px;color:var(--accent);
  letter-spacing:.05em;margin-top:10px}
.fit{position:relative;z-index:5;flex:none;text-align:center;font-family:'JetBrains Mono',monospace;
  font-weight:500;font-size:20px;letter-spacing:.05em;color:rgba(255,255,255,.5);margin-bottom:18px}
.foot{position:relative;z-index:5;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding-bottom:335px;font-family:'JetBrains Mono',monospace;font-weight:800;letter-spacing:.06em}
.fb{font-size:26px;color:rgba(255,255,255,.62)}
.fd{font-size:30px;color:var(--accent)}
</style></head>
<body><div class="ad bg-dark">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="top">
    <div class="eyebrow">18 QT FISH FRYER &middot; POWERED</div>
    <div class="big">350&deg;</div>
    <div class="sw">IN AS FAST AS 5 MINUTES</div>
    <div class="plus">FISH &middot; WINGS &middot; FRIES &middot; OKRA &middot; HUSHPUPPIES</div>
  </div>
  <div class="glow"></div>
  <div class="mid"><div class="pbox shadow" style="width:800px;height:483px;transform:translate(31px,0)"><img src="../../../../assets/product-cutouts/18qt - pwd.png" style="width:1151px;left:-173px;top:-529px"></div></div>
  <div class="bar">BOTH CODES STACK &middot; ENTER AT CHECKOUT</div>
  <div class="codes">
    <div class="chip"><div class="k">LABORDAY10-26</div><div class="v">10% OFF SITEWIDE</div></div>
    <div class="chip"><div class="k">LABORDAY30-LEGS</div><div class="v">30% OFF LEGS</div></div>
  </div>
  <div class="fit">LEG EXTENSIONS FIT THIS FRYER &mdash; RAISE IT TO WORKING HEIGHT</div>
  <div class="foot"><div class="fb">BUILT IN LOUISIANA</div><div class="fd">ENDS 11:59 PM CT</div></div>
</div></body></html>
