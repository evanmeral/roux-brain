<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1920px}
.ad{padding:0}
.logo{width:180px;top:268px;left:50%;transform:translateX(-50%)}
.top{position:absolute;left:80px;right:80px;top:470px;z-index:4;text-align:center}
.eyebrow{color:var(--accent);font-size:23px}
.hl{color:#fff;font-size:150px;margin-top:20px;line-height:.88}
.hl .o{background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.hl small{display:block;font-size:60px;font-weight:800;letter-spacing:-.02em;margin-top:8px;color:#fff}
.strip{margin-top:30px;display:inline-flex;align-items:center;gap:16px;background:var(--flame);
  border-radius:12px;padding:17px 30px}
.strip .n{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:40px;color:#fff;line-height:1}
.strip .t{font-weight:700;font-size:26px;color:#fff;line-height:1.15;letter-spacing:-.01em;text-align:left}
.glow{width:860px;height:480px;left:110px;bottom:488px;z-index:1}
.pzone{position:absolute;left:0;right:0;top:868px;bottom:488px;z-index:2;
  display:flex;align-items:center;justify-content:center}
.shadow{filter:drop-shadow(0 34px 50px rgba(0,0,0,.55))}
.codes{position:absolute;left:80px;right:80px;bottom:384px;z-index:5;display:flex;gap:16px}
.code{flex:1;border:2px dashed rgba(255,255,255,.42);border-radius:10px;padding:15px 8px;text-align:center}
.code .k{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:22px;color:#fff}
.code .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;color:var(--accent);
  letter-spacing:.13em;margin-top:8px}
.foot{position:absolute;left:80px;right:80px;bottom:172px;z-index:5;text-align:center}
.cta{font-size:29px;padding:.85em 2.1em}
.brand{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;
  color:rgba(255,255,255,.6);letter-spacing:.2em;margin-top:26px}
.legal{position:absolute;left:80px;right:80px;bottom:118px;font-size:13px;color:#fff;z-index:5;text-align:center}
</style></head>
<body><div class="ad bg-dark">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="top">
    <div class="eyebrow">Labor Day Sale · Sept 1–8</div>
    <div class="hl"><span class="o">10% OFF</span><small>SITEWIDE</small></div>
    <div class="strip"><div class="n">30%</div><div class="t">off leg<br>extensions</div></div>
  </div>
  <div class="glow"></div>
  <div class="pzone"><div class="pbox shadow" style="width:354px;height:575px"><img src="../../../../assets/product-cutouts/18qt pwd on leg extensions.png" style="width:814px;left:-228px;top:-255px"></div></div>
  <div class="codes">
    <div class="code"><div class="k">LABORDAY10-26</div><div class="v">10% OFF SITEWIDE</div></div>
    <div class="code"><div class="k">LABORDAY30-LEGS</div><div class="v">30% OFF LEG EXT.</div></div>
  </div>
  <div class="foot">
    <div class="cta">Shop the sale</div>
    <div class="brand">HIGH PERFORMANCE COOKERS · COVINGTON, LA</div>
  </div>
  <div class="legal">Enter codes at checkout. Sept 1–8, 2026.</div>
</div></body></html>
