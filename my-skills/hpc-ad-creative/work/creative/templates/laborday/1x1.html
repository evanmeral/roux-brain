<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1080px}
.ad{padding:0}
.logo{width:126px;top:46px;right:56px}
.top{position:relative;z-index:4;padding:52px 64px 0;max-width:640px}
.eyebrow{color:var(--accent);font-size:19px}
.hl{color:#fff;font-size:116px;margin-top:14px;line-height:.9}
.hl .o{background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.hl small{display:block;font-size:46px;font-weight:800;letter-spacing:-.02em;margin-top:4px;color:#fff}
.strip{margin-top:22px;display:inline-flex;align-items:center;gap:13px;background:var(--flame);
  border-radius:10px;padding:13px 22px}
.strip .n{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:32px;color:#fff;line-height:1}
.strip .t{font-weight:700;font-size:21px;color:#fff;line-height:1.15;letter-spacing:-.01em}
.glow{width:600px;height:400px;right:0px;bottom:200px;z-index:1}
.pzone{position:absolute;left:556px;right:36px;top:154px;bottom:212px;z-index:2;
  display:flex;align-items:center;justify-content:center}
.shadow{filter:drop-shadow(0 30px 44px rgba(0,0,0,.55))}
.codes{position:absolute;left:64px;right:64px;bottom:126px;z-index:5;display:flex;gap:14px}
.code{flex:1;border:2px dashed rgba(255,255,255,.42);border-radius:10px;padding:13px 10px;text-align:center}
.code .k{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:23px;color:#fff}
.code .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;color:var(--accent);
  letter-spacing:.14em;margin-top:8px}
.foot{position:absolute;left:64px;right:64px;bottom:54px;z-index:5;
  display:flex;align-items:center;justify-content:space-between}
.brand{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;color:var(--accent);
  letter-spacing:.18em;line-height:1.7}
.brand b{display:block;font-family:'Poppins';font-weight:800;font-size:18px;color:#fff;letter-spacing:-.02em}
.cta{font-size:21px}
.legal{position:absolute;left:64px;right:64px;bottom:26px;font-size:11px;color:#fff;z-index:5;text-align:center}
</style></head>
<body><div class="ad bg-dark">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="top">
    <div class="eyebrow">Labor Day Sale · Sept 1–8</div>
    <div class="hl"><span class="o">10% OFF</span><small>SITEWIDE</small></div>
    <div class="strip"><div class="n">30%</div><div class="t">off leg<br>extensions</div></div>
  </div>
  <div class="glow"></div>
  <div class="pzone"><div class="pbox shadow" style="width:382px;height:620px"><img src="../../../../assets/product-cutouts/18qt pwd on leg extensions.png" style="width:877px;left:-246px;top:-275px"></div></div>
  <div class="codes">
    <div class="code"><div class="k">LABORDAY10-26</div><div class="v">10% OFF SITEWIDE</div></div>
    <div class="code"><div class="k">LABORDAY30-LEGS</div><div class="v">30% OFF LEG EXTENSIONS</div></div>
  </div>
  <div class="foot">
    <div class="brand"><b>High Performance Cookers</b>BUILT IN LOUISIANA</div>
    <div class="cta">Shop the sale</div>
  </div>
  <div class="legal">Enter codes at checkout. Sept 1–8, 2026.</div>
</div></body></html>
