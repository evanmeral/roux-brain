<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1350px}
.ad{padding:46px 54px 0;display:flex;flex-direction:column}
.logo{width:130px;top:44px;right:54px}
.top{position:relative;z-index:4;flex:none}
.eyebrow{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:800;
  font-size:29px;letter-spacing:.13em}
.big{font-weight:900;font-size:138px;line-height:.80;letter-spacing:-.05em;margin-top:14px;
  background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.clock{display:inline-flex;align-items:center;gap:16px;margin-top:16px}
.clock .t{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:54px;color:#fff;letter-spacing:-.02em}
.clock .z{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:28px;color:rgba(255,255,255,.55);
  letter-spacing:.10em;padding-top:12px}
.plus{display:inline-block;margin-top:22px;background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;
  padding:13px 26px;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:27px;letter-spacing:.03em}
.plus b{color:var(--accent)}
.glow{width:820px;height:400px;left:130px;bottom:340px;z-index:1}
.mid{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;z-index:2;padding:30px 0 38px}
.shadow{filter:drop-shadow(0 32px 46px rgba(0,0,0,.6))}
.bar{position:relative;z-index:5;flex:none;background:var(--flame);color:#fff;border-radius:9px;
  padding:18px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:31px;
  letter-spacing:.05em;margin-bottom:16px}
.codes{position:relative;z-index:5;flex:none;display:flex;gap:14px;margin-bottom:16px}
.chip{flex:1;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.4);
  border-radius:9px;padding:18px 6px;text-align:center}
.chip .k{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:40px;color:#fff;letter-spacing:-.02em}
.chip .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:24px;color:var(--accent);
  letter-spacing:.05em;margin-top:10px}
.fit{position:relative;z-index:5;flex:none;text-align:center;font-family:'JetBrains Mono',monospace;
  font-weight:500;font-size:19px;letter-spacing:.05em;color:rgba(255,255,255,.5);margin-bottom:16px}
.foot{position:relative;z-index:5;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding-bottom:34px;font-family:'JetBrains Mono',monospace;font-weight:800;letter-spacing:.06em}
.fb{font-size:26px;color:rgba(255,255,255,.62)}
.fd{font-size:30px;color:var(--accent)}
</style></head>
<body><div class="ad bg-dark">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="top">
    <div class="eyebrow">LABOR DAY SALE &middot; FINAL HOURS</div>
    <div class="big">ENDS<br>TONIGHT</div>
    <div class="clock"><div class="t">11:59 PM</div><div class="z">CENTRAL</div></div>
    <div class="plus"><b>10% OFF</b> SITEWIDE + <b>30% OFF</b> LEGS</div>
  </div>
  <div class="glow"></div>
  <div class="mid"><div class="pbox shadow" style="width:499px;height:430px"><img src="../../../../assets/product-cutouts/120qt - pwd.png" style="width:708px;left:-113px;top:-66px"></div></div>
  <div class="bar">BOTH CODES STACK &middot; ENTER AT CHECKOUT</div>
  <div class="codes">
    <div class="chip"><div class="k">LABORDAY10-26</div><div class="v">10% OFF SITEWIDE</div></div>
    <div class="chip"><div class="k">LABORDAY30-LEGS</div><div class="v">30% OFF LEGS</div></div>
  </div>
  <div class="fit">LEG EXTENSIONS FIT THE 18 QT, 4-WAY AND 40 QT</div>
  <div class="foot"><div class="fb">BUILT IN LOUISIANA</div><div class="fd">TUE SEPT 8</div></div>
</div></body></html>
