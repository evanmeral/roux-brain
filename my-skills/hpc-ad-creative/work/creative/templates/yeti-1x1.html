<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../brand.css">
<style>
html,body{width:1080px;height:1080px}
.ad{background:var(--offwhite);padding:0}
.grid{display:grid;grid-template-columns:1fr 1fr;height:100%}
.left{position:relative;padding:74px 34px 74px 74px;display:flex;flex-direction:column;justify-content:center}
.logo{width:132px;top:60px;left:74px}
.eyebrow{color:var(--accent-dk);font-size:20px;margin-bottom:24px}
.hl{font-size:76px;color:var(--ink)}
.rule{margin:30px 0 26px}
.sub{font-size:24px;color:var(--muted);max-width:410px}
.cta{margin-top:36px;font-size:23px;align-self:flex-start}
.right{position:relative;background:var(--ink);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.right:after{content:"";position:absolute;inset:0;
  background:radial-gradient(90% 70% at 50% 108%,rgba(246,147,41,.42),transparent 62%)}
.shadow{z-index:2;filter:drop-shadow(0 30px 44px rgba(0,0,0,.5))}
.stamp{position:absolute;top:56px;left:0;right:0;text-align:center;z-index:3;
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:19px;color:#fff;letter-spacing:.2em}
.stamp b{color:var(--accent)}
.warranty{position:absolute;bottom:48px;left:0;right:0;text-align:center;z-index:3;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;
  color:rgba(255,255,255,.72);letter-spacing:.14em}
</style></head>
<body><div class="ad"><div class="grid">
  <div class="left">
    <img class="logo" src="../../../assets/brand-refs/HPC-ShieldLogo-Color.png">
    <div class="eyebrow">Cheap pots are expensive</div>
    <div class="hl">Buy the<br>cheap one<br>twice.</div>
    <div class="rule"></div>
    <div class="sub">Or buy 4mm aluminum once. Same reason you stopped buying styrofoam ice chests.</div>
    <div class="cta">See what lasts</div>
  </div>
  <div class="right">
    <div class="stamp">4MM <b>·</b> MADE IN USA</div>
    <div class="pbox shadow" style="width:446px;height:409px"><img src="../../../assets/product-cutouts/80qt - pwd.png" style="width:480px;left:-19px;top:-141px"></div>
    <div class="warranty">5-YR RESIDENTIAL WARRANTY</div>
  </div>
</div></div></body></html>
