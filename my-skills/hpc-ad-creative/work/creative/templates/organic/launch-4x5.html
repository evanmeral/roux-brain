<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1350px}
.ad{position:relative;overflow:hidden;background:#0C0B0A}
.bg{position:absolute;inset:0;background-image:url('../../../../assets/lifestyle/Crawfishboil-basket-pour.png');
  background-size:cover;background-position:50% 46%}
.top{position:absolute;left:0;right:0;top:0;height:34%;
  background:linear-gradient(180deg,rgba(8,7,6,.80),rgba(8,7,6,.30) 60%,transparent)}
.bot{position:absolute;left:0;right:0;bottom:0;height:46%;
  background:linear-gradient(0deg,rgba(8,7,6,.92),rgba(8,7,6,.55) 45%,transparent)}
.logo{width:132px;top:52px;left:56px}
.kick{position:absolute;top:74px;right:56px;z-index:4;text-align:right;
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:26px;color:#fff;letter-spacing:.16em;
  line-height:1.5}
.kick span{display:block;color:var(--gold);font-size:22px}
.copy{position:absolute;left:56px;right:56px;bottom:56px;z-index:4}
.hl{color:#fff;font-size:96px;font-weight:900;line-height:.95;letter-spacing:-.03em;
  text-shadow:0 4px 24px rgba(0,0,0,.5)}
.hl em{font-style:normal;color:var(--gold)}
.sub{color:rgba(255,255,255,.9);font-size:34px;font-weight:600;margin-top:22px;line-height:1.35}
.codes{margin-top:26px;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:30px;
  color:#fff;line-height:1.65;letter-spacing:.02em}
.codes b{color:var(--gold)}
.dates{margin-top:20px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:24px;
  color:rgba(255,255,255,.62);letter-spacing:.12em}
</style></head>
<body><div class="ad">
  <div class="bg"></div><div class="top"></div><div class="bot"></div>
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="kick">LABOR DAY<span>SEPT 1&ndash;8</span></div>
  <div class="copy">
    <div class="hl">Feed the whole<br>crowd for <em>less.</em></div>
    <div class="sub">10% off everything. 30% off leg extensions.</div>
    <div class="codes">LABORDAY10-26 <b>&middot;</b> LABORDAY30-LEGS</div>
    <div class="dates">USE BOTH AT CHECKOUT</div>
  </div>
</div></body></html>
