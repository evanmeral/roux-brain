<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1920px}
.ad{position:relative;overflow:hidden;background:#0A0908}
.bg{position:absolute;inset:0;background-image:url('../../../../assets/lifestyle/Cooked-crawfish.png');
  background-size:cover;background-position:50% 45%;filter:brightness(.60) contrast(1.05)}
.vig{position:absolute;inset:0;
  background:radial-gradient(78% 55% at 50% 40%,transparent 0%,rgba(8,7,6,.55) 70%,rgba(8,7,6,.92) 100%)}
.bot{position:absolute;left:0;right:0;bottom:0;height:42%;
  background:linear-gradient(0deg,rgba(8,7,6,.9),transparent)}
.logo{width:150px;top:252px;left:50%;transform:translateX(-50%)}
.mid{position:absolute;left:64px;right:64px;top:50%;transform:translateY(-50%);z-index:4;text-align:center}
.hl{color:#fff;font-size:158px;font-weight:900;letter-spacing:-.05em;line-height:.9;
  text-shadow:0 6px 34px rgba(0,0,0,.6)}
.rule{width:120px;height:4px;background:var(--accent);border-radius:2px;margin:38px auto 0}
.sub{color:rgba(255,255,255,.9);font-size:38px;font-weight:600;margin-top:36px;line-height:1.35}
.foot{position:absolute;left:64px;right:64px;bottom:392px;z-index:4;text-align:center;
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:27px;color:var(--accent);
  letter-spacing:.18em}
.foot span{display:block;color:rgba(255,255,255,.55);font-size:22px;letter-spacing:.14em;margin-top:14px}
</style></head>
<body><div class="ad">
  <div class="bg"></div><div class="vig"></div><div class="bot"></div>
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="mid">
    <div class="hl">2 DAYS<br>LEFT.</div>
    <div class="rule"></div>
    <div class="sub">Then it's back<br>to full price.</div>
  </div>
  <div class="foot">LABORDAY10-26<span>LABORDAY30-LEGS &middot; ENDS SEPT 8</span></div>
</div></body></html>
