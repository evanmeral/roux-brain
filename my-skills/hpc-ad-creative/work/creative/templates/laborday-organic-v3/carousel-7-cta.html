<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1350px}
.ad{position:relative;overflow:hidden;background:#0A0908}
/* Landscape source (3266x1818) into a 4:5 frame: cover scales by HEIGHT, so the whole
   photo height shows and only the middle ~44% of the width. Vertical background-position
   does nothing here — x picks the slice. Sparks land behind the headline by design. */
.bg{position:absolute;inset:0;background-image:url('../../../../assets/lifestyle/Welder-welding-tunneltubes.png');
  background-size:cover;background-position:46% 50%;filter:brightness(.86) contrast(1.04) saturate(.58)}
/* Scrims are LOCAL, not global: the plate is brightened so the welder and the arc actually
   read, then the type bands are protected individually. The radial stays open through the
   middle (arc + gloves), the linear does the work under the code, small print and footer —
   the small grey lines are the first thing to disappear, so they get the heaviest cover. */
.vig{position:absolute;inset:0;background:radial-gradient(94% 66% at 50% 42%,rgba(8,7,6,.06) 0%,rgba(8,7,6,.40) 58%,rgba(8,7,6,.84) 100%)}
.vig2{position:absolute;inset:0;background:linear-gradient(180deg,
  rgba(8,7,6,.46) 0%, rgba(8,7,6,.10) 18%, rgba(8,7,6,.12) 40%,
  rgba(8,7,6,.46) 56%, rgba(8,7,6,.74) 66%, rgba(8,7,6,.88) 76%,
  rgba(8,7,6,.93) 88%, rgba(8,7,6,.96) 100%)}
.logo{width:150px;top:150px;left:50%;transform:translateX(-50%)}
.num{position:absolute;top:60px;right:60px;z-index:5;font-family:'JetBrains Mono',monospace;
  font-weight:800;font-size:26px;color:rgba(255,255,255,.38);letter-spacing:.14em}
.mid{position:absolute;left:70px;right:70px;top:52%;transform:translateY(-50%);z-index:5;text-align:center}
.hl{color:#fff;font-size:92px;font-weight:900;letter-spacing:-.04em;line-height:.98;
  text-shadow:0 6px 30px rgba(0,0,0,.6)}
.hl em{font-style:normal;color:var(--gold)}
.sub{color:rgba(255,255,255,.86);font-size:36px;font-weight:600;margin-top:34px;line-height:1.34}
.codes{margin-top:52px;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:34px;
  color:#fff;line-height:1.9;letter-spacing:.02em}
.codes b{color:var(--gold);display:block}
.codes small{display:block;font-size:24px;font-weight:700;color:rgba(255,255,255,.55);
  letter-spacing:.14em;margin-top:18px}
.foot{position:absolute;left:70px;right:70px;bottom:78px;z-index:5;text-align:center;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:24px;
  color:rgba(255,255,255,.5);letter-spacing:.14em;line-height:1.7}
</style></head>
<body><div class="ad">
  <div class="bg"></div><div class="vig"></div><div class="vig2"></div>
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="num">07 / 07</div>
  <div class="mid">
    <div class="hl">All the gear,<br><em>10% off.</em></div>
    <div class="sub">Labor Day sale runs through Sept 8.</div>
    <div class="codes">
      LABORDAY10-26
      <small>30% OFF LEG EXTENSIONS &middot; LABORDAY30-LEGS<br>BOTH CODES WORK ON ONE ORDER</small>
    </div>
  </div>
  <div class="foot">BUILT IN COVINGTON, LOUISIANA<br>MOST ORDERS SHIP IN 1&ndash;2 BUSINESS DAYS</div>
</div></body></html>
