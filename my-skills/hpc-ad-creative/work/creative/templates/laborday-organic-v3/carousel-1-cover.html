<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1350px}
.ad{position:relative;overflow:hidden;background:#0A0908}
.bg{position:absolute;inset:0;background-image:url('../../../../assets/lifestyle/BB-burner-lifestyle.png');
  background-size:cover;background-position:50% 42%;filter:brightness(.62) contrast(1.05) saturate(1.05)}
.vig{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,7,6,.68) 0%,rgba(8,7,6,.34) 26%,rgba(8,7,6,.70) 62%,rgba(8,7,6,.96) 100%)}
.logo{width:138px;top:56px;left:56px}
.mid{position:absolute;left:70px;right:70px;top:50%;transform:translateY(-50%);z-index:4}
.hl{color:#fff;font-size:80px;font-weight:900;letter-spacing:-.042em;line-height:1.02;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.hl em{font-style:normal;color:var(--gold)}
.rule{width:110px;height:5px;background:var(--accent);border-radius:3px;margin:40px 0 0}
.sub{color:rgba(255,255,255,.92);font-size:40px;font-weight:600;margin-top:38px;line-height:1.32;max-width:860px}
.swipe{position:absolute;left:70px;bottom:64px;z-index:4;font-family:'JetBrains Mono',monospace;
  font-weight:800;font-size:28px;color:var(--accent);letter-spacing:.2em}
.kick{position:absolute;top:74px;right:56px;z-index:4;text-align:right;font-family:'JetBrains Mono',monospace;
  font-weight:800;font-size:25px;color:#fff;letter-spacing:.16em;line-height:1.5}
.kick span{display:block;color:var(--gold);font-size:21px}
</style></head>
<body><div class="ad">
  <div class="bg"></div><div class="vig"></div>
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="kick">LABOR DAY<span>SEPT 1&ndash;8</span></div>
  <div class="mid">
    <div class="hl">Everybody talks<br>about the pot.<br><em>Let&rsquo;s talk about<br>everything around it.</em></div>
    <div class="rule"></div>
    <div class="sub">Burners, brackets, trays and the accessory line that keeps the boil running.</div>
  </div>
  <div class="swipe">SWIPE &rarr;</div>
</div></body></html>
