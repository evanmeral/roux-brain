<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1350px}
.ad{position:relative;overflow:hidden;background:var(--char)}
.glow{width:920px;height:520px;left:50%;top:40%;transform:translate(-50%,-50%);opacity:.85}
.logo{width:118px;top:52px;left:56px}
.num{position:absolute;top:60px;right:60px;z-index:5;font-family:'JetBrains Mono',monospace;
  font-weight:800;font-size:26px;color:rgba(255,255,255,.38);letter-spacing:.14em}
.stage{position:absolute;left:0;right:0;top:150px;height:500px;z-index:4;
  display:flex;align-items:center;justify-content:center}
/* brand.css sets .pbox{overflow:hidden}, which clips the img's drop-shadow into a
   visible rectangle against the glow. Unclip it — the box still sets the layout
   footprint, and everything outside the product's alpha bbox is transparent. */
.pbox{overflow:visible}
.pbox img{filter:drop-shadow(0 40px 60px rgba(0,0,0,.55))}
.copy{position:absolute;left:70px;right:70px;top:694px;z-index:5;text-align:center}
.eyebrow{color:var(--accent);font-size:26px;letter-spacing:.2em;display:block}
.hl{color:#fff;font-size:70px;font-weight:900;letter-spacing:-.035em;line-height:1.02;margin-top:22px}
.rule{width:88px;height:4px;background:var(--accent);border-radius:2px;margin:26px auto 0}
.sub{color:rgba(255,255,255,.82);font-size:32px;font-weight:600;margin-top:26px;line-height:1.34}
.stats{position:absolute;left:70px;right:70px;bottom:112px;z-index:5;text-align:center;
  border-top:1px solid rgba(255,255,255,.14);padding-top:28px}
.stat{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:24px;color:#fff;
  letter-spacing:.07em;line-height:1.62}
.stat b{color:var(--gold)}
.swipe{position:absolute;left:0;right:0;bottom:50px;z-index:5;text-align:center;
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:23px;color:rgba(255,255,255,.42);
  letter-spacing:.2em}
</style></head>
<body><div class="ad">
  <div class="glow"></div>
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="num">05 / 07</div>
  <div class="stage"><div class="pbox" style="width:660px;height:428px;transform:translate(-30px,14px)"><img src="../../../../assets/product-cutouts/80qt-steamer-tray.png" style="width:848px;left:-61px;top:-386px"></div></div>
  <div class="copy">
    <span class="eyebrow">STEAMER TRAYS</span>
    <div class="hl">Turn the pot you<br>already own into<br>a steamer.</div>
    <div class="rule"></div>
    <div class="sub">Sized to match your pot &mdash;<br>30 QT up to 120 QT.</div>
  </div>
  <div class="stats"><div class="stat">FIXED INSERTS FROM <b>$24.99</b><br>ADJUSTABLE SHELVES FROM <b>$119.99</b></div></div>
  <div class="swipe">SWIPE &rarr;</div>
</div></body></html>
