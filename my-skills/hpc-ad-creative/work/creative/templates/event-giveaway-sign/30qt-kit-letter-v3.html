<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../brand.css">
<style>
/* Letter portrait, 8.5 x 11 in at 300 dpi. 1 px = 1/300 in; 1 pt = 4.167 px.
   v3: full-kit photo as the hero, value badge top-right, $475 (Evan, 2026-09-18). */
html,body{width:2550px;height:3300px}
.ad{background:var(--char);color:#fff;align-items:center;padding:150px 150px 140px;text-align:center}
.ad::before{content:"";position:absolute;inset:0;
  background:radial-gradient(52% 32% at 50% 52%,rgba(246,147,41,.45) 0%,rgba(225,52,24,.15) 50%,transparent 75%)}
.ad>*{position:relative;z-index:2}
.top,.bot{height:14px;width:100%;position:absolute;left:0;background:var(--flame)}
.top{top:0}.bot{bottom:0}
.head{display:flex;align-items:center;gap:80px}
.shield{height:470px}
.head .txt{text-align:left}
.eyebrow{font-size:62px;color:var(--gold);letter-spacing:.3em}
.hl{font-size:220px;font-weight:900;letter-spacing:-.035em;line-height:.9;margin-top:0;text-transform:uppercase;white-space:nowrap;
  background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:40px;width:100%;min-height:0}
.stage .pbox{filter:drop-shadow(0 50px 70px rgba(0,0,0,.6))}
.side{display:flex;flex-direction:column;align-items:center;gap:26px;width:560px}
.side .eyebrow{font-size:46px;letter-spacing:.2em;color:rgba(255,255,255,.7)}
.item{display:flex;flex-direction:column;align-items:center;gap:26px}
.item .pbox{filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.item b{font-size:68px;font-weight:800;color:#fff}
.item b i{font-style:normal;color:var(--accent)}
.value{background:var(--flame);border-radius:26px;padding:34px 30px 38px;width:560px;position:absolute;right:0;top:40px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.value small{display:block;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:44px;letter-spacing:.18em;text-transform:uppercase;color:rgba(26,25,24,.85)}
.value strong{display:block;font-size:150px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;line-height:1;margin-top:10px;color:#1A1918}
.value strong sup{font-size:.45em;vertical-align:.95em;margin-right:4px}
.name{font-size:132px;font-weight:800;letter-spacing:-.02em;line-height:1}
.name span{color:var(--accent)}
.kit{display:flex;gap:26px;margin-top:56px;justify-content:center}
.kit div{font-weight:700;font-size:72px;padding:.3em .7em;border:5px solid rgba(246,147,41,.8);border-radius:18px;white-space:nowrap}
.donor{margin-top:70px;font-size:84px;line-height:1.1;white-space:nowrap;font-weight:500;font-style:italic;color:rgba(255,255,255,.9)}
.donor b{font-style:normal;font-weight:800;color:var(--gold)}
.foot{margin-top:70px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:52px;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(255,255,255,.72)}
.foot b{color:#fff}
</style></head><body>
<div class="ad">
  <div class="top"></div><div class="bot"></div>
  <div class="head">
    <img class="shield" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
    <div class="txt"><div class="hl">Feel the Heat</div></div>
  </div>
  <div class="stage">
    <div class="pbox" style="width:1538px;height:1700px"><img src="../../../../assets/product-cutouts/updated-2026-09/30qt w steamer rack - pwd - full kit with turkey rack.png" style="width:2448px;left:-453px;top:-780px"></div>
    <div class="value"><small>Retail Value</small><strong><sup>$</sup>475</strong></div>
  </div>
  <div class="name">30 QT Powered Cooker <span>· Full Kit</span></div>
  <div class="kit"><div>Pot</div><div>Basket</div><div>Lid</div><div>Steamer Tray</div><div>Turkey Rack</div></div>
  <div class="donor">Generously donated by <b>High Performance Cookers</b></div>
  <div class="foot">Hand-welded Tunnel Tubes · Built in Louisiana<br><b>highperformancecookers.com</b></div>
</div></body></html>
