<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1080px}
.ad{padding:60px 62px 0}
.copy{position:relative;z-index:4}
.eyebrow{color:var(--accent);font-size:21px;margin-bottom:26px}
.logo{width:102px;top:56px;right:62px}
.hl{color:#fff;font-size:72px;max-width:730px}
.hl .accent{background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:rgba(255,255,255,.78);font-size:22px;max-width:700px;margin-top:18px}
.specs{display:flex;gap:0;margin-top:26px;border-top:1px solid rgba(255,255,255,.16);
  border-bottom:1px solid rgba(255,255,255,.16)}
.spec{flex:1;padding:22px 18px 20px;border-right:1px solid rgba(255,255,255,.16);text-align:center}
.spec:last-child{border-right:0}
.spec .n{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:34px;color:#fff;line-height:1}
.spec .n em{font-style:normal;font-size:20px;color:var(--accent)}
.spec .n i{font-style:normal;font-family:'Poppins';font-weight:600;font-size:17px;color:rgba(255,255,255,.6);margin-right:6px}
/* Round 3 correction (Evan, 2026-09-15): the number above ("6.5-7min" etc) is back to its
   ORIGINAL size — headline-tier text was fine. This label is the actual "smaller text"
   Evan flagged as unreadable; pushed hard past round 2's 30px. Label copy trimmed
   "TO A ROLLING BOIL" -> "ROLLING BOIL" so it holds one line at this size. */
.spec .l{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:32px;white-space:nowrap;
  color:rgba(255,255,255,.78);letter-spacing:0;margin-top:12px}
.glow{width:700px;height:340px;left:190px;bottom:112px;z-index:1}
.pzone{position:absolute;left:0;right:0;top:480px;bottom:125px;z-index:2;
  display:flex;align-items:center;justify-content:center}
.shadow{filter:drop-shadow(0 30px 44px rgba(0,0,0,.55))}
.foot{position:absolute;left:62px;right:62px;bottom:60px;z-index:5;
  display:flex;align-items:center;justify-content:space-between}
/* HPC logo already sits top-right of this ad, so the wordmark is redundant here —
   dropped per Evan, 2026-09-15. "BUILT IN LOUISIANA" now carries the footer alone,
   sized up to the weight the wordmark used to carry so it doesn't read as an orphan. */
.brand{font-family:'Poppins';font-weight:800;font-size:21px;color:#fff;letter-spacing:-.02em}
.cta{font-size:22px}
.legal{position:absolute;left:58px;right:58px;bottom:20px;font-size:26px;color:#fff;z-index:5;text-align:center}
</style></head>
<body><div class="ad bg-dark">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="copy">
    <div class="eyebrow">Home of the 7 minute boil</div>
    <div class="hl">Cold water to a<br><span class="accent">rolling boil.</span></div>
    <div class="sub">Tunnel Tube technology is in the pot &mdash; so it works on any burner you already own.</div>
    <div class="specs">
      <div class="spec"><div class="n">6.5&ndash;7<em>min</em></div><div class="l">ROLLING BOIL</div></div>
      <div class="spec"><div class="n">~90<em>sec</em></div><div class="l">RECOVERY</div></div>
      <div class="spec"><div class="n"><i>up to</i>75<em>%</em></div><div class="l">LESS PROPANE</div></div>
    </div>
  </div>
  <div class="glow"></div>
  <div class="pzone"><div class="pbox shadow" style="width:277px;height:430px"><img src="../../../../assets/product-cutouts/120qt on BB-TJB_.png" style="width:408px;left:-69px;top:-57px"></div></div>
  <div class="foot">
    <div class="brand">BUILT IN LOUISIANA</div>
    <div class="cta">Shop the 7-minute boil</div>
  </div>
  <div class="legal">Boil times vary with volume, temp and fuel pressure.</div>
</div></body></html>
