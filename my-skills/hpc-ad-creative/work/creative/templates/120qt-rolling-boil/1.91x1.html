<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1200px;height:628px}
.ad{padding:0}
.grid{display:flex;height:100%}
.left{position:relative;z-index:4;width:706px;flex:none;padding:44px 30px 44px 52px;
  display:flex;flex-direction:column;justify-content:center}
.eyebrow{color:var(--accent);font-size:18px;margin-bottom:20px}
.hl{color:#fff;font-size:60px}
.hl .accent{background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:rgba(255,255,255,.78);font-size:19px;max-width:600px;margin-top:18px}
.specs{display:flex;margin-top:26px;border-top:1px solid rgba(255,255,255,.16);
  border-bottom:1px solid rgba(255,255,255,.16)}
.spec{flex:1;padding:16px 12px 15px;border-right:1px solid rgba(255,255,255,.16);text-align:center}
.spec:last-child{border-right:0}
.spec .n{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:26px;color:#fff;line-height:1}
.spec .n em{font-style:normal;font-size:15px;color:var(--accent)}
.spec .n i{font-style:normal;font-family:'Poppins';font-weight:600;font-size:13px;color:rgba(255,255,255,.6);margin-right:5px}
.spec .l{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9px;
  color:rgba(255,255,255,.5);letter-spacing:.15em;margin-top:8px}
.cta{margin-top:24px;font-size:19px;align-self:flex-start}
.right{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center}
.glow{width:470px;height:320px;left:50%;top:50%;transform:translate(-58%,-4%);z-index:1}
.shadow{position:relative;z-index:2;filter:drop-shadow(0 26px 40px rgba(0,0,0,.55))}
.logo{width:88px;top:34px;right:44px}
.legal{position:absolute;left:52px;bottom:20px;font-size:10px;color:#fff;z-index:5}
</style></head>
<body><div class="ad bg-dark"><div class="grid">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="left">
    <div class="eyebrow">Home of the 7 minute boil</div>
    <div class="hl">Cold water to a<br><span class="accent">rolling boil.</span></div>
    <div class="sub">Tunnel Tube technology is in the pot &mdash; so it works on any burner you already own.</div>
    <div class="specs">
      <div class="spec"><div class="n">6.5&ndash;7<em>min</em></div><div class="l">TO A ROLLING BOIL</div></div>
      <div class="spec"><div class="n">~90<em>sec</em></div><div class="l">RECOVERY</div></div>
      <div class="spec"><div class="n"><i>up to</i>75<em>%</em></div><div class="l">LESS PROPANE</div></div>
    </div>
    <div class="cta">Shop the 7-minute boil</div>
  </div>
  <div class="right">
    <div class="glow"></div>
    <div class="pbox shadow" style="width:284px;height:440px;transform:translate(-42px,14px)"><img src="../../../../assets/product-cutouts/120qt on BB-TJB_.png" style="width:418px;left:-71px;top:-58px"></div>
  </div>
  <div class="legal">Boil times vary with volume, ambient temperature and fuel pressure.</div>
</div></div></body></html>
