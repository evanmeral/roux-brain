<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1920px}
.ad{padding:256px 74px 0}
.copy{position:relative;z-index:4}
.eyebrow{color:var(--accent);font-size:28px;margin-bottom:34px}
.logo{width:132px;top:250px;right:74px}
.hl{color:#fff;font-size:104px;max-width:850px}
.hl .accent{background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:rgba(255,255,255,.78);font-size:31px;max-width:760px;margin-top:30px}
.specs{display:flex;gap:0;margin-top:44px;border-top:1px solid rgba(255,255,255,.16);
  border-bottom:1px solid rgba(255,255,255,.16)}
.spec{flex:1;padding:30px 20px 28px;border-right:1px solid rgba(255,255,255,.16);text-align:center}
.spec:last-child{border-right:0}
.spec .n{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:42px;color:#fff;line-height:1}
.spec .n em{font-style:normal;font-size:24px;color:var(--accent)}
.spec .n i{font-style:normal;font-family:'Poppins';font-weight:600;font-size:20px;color:rgba(255,255,255,.6);margin-right:7px}
/* Round 3 correction (Evan, 2026-09-15): number reverted to ORIGINAL size; this label is
   the flagged "smaller text," pushed hard past round 2. Copy trimmed to fit one line. */
.spec .l{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:36px;white-space:nowrap;
  color:rgba(255,255,255,.78);letter-spacing:0;margin-top:14px}
.glow{width:880px;height:480px;left:100px;bottom:450px;z-index:1}
.pzone{position:absolute;left:0;right:0;top:835px;bottom:420px;z-index:2;
  display:flex;align-items:center;justify-content:center}
.shadow{filter:drop-shadow(0 34px 50px rgba(0,0,0,.55))}
.foot{position:absolute;left:74px;right:74px;bottom:314px;z-index:5;
  display:flex;align-items:center;justify-content:space-between}
/* Logo already sits top of this ad, so the wordmark text is redundant — dropped
   per Evan, 2026-09-15. "BUILT IN LOUISIANA" carries the footer alone. */
.brand{font-family:'Poppins';font-weight:800;font-size:26px;color:#fff;letter-spacing:-.02em}
.cta{font-size:27px}
.legal{position:absolute;left:70px;right:70px;bottom:250px;font-size:26px;color:#fff;z-index:5;text-align:center}
</style></head>
<body><div class="ad bg-dark">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="copy">
    <div class="eyebrow">Home of the 7 minute boil</div>
    <div class="hl">Cold water to a<br><span class="accent">rolling boil.</span></div>
    <div class="sub">Tunnel Tube technology is in the pot &mdash; so it works on any burner you already own.</div>
    <div class="specs">
      <div class="spec"><div class="n">6.5&ndash;7<em>min</em></div><div class="l">ROLLING BOIL</div></div>
      <div class="spec"><div class="n">~90<em>sec</em></div><div class="l">RECOVERY</div></div>
      <div class="spec"><div class="n"><i>up to</i>75<em>%</em></div><div class="l">LESS PROPANE</div></div>
    </div>
  </div>
  <div class="glow"></div>
  <div class="pzone"><div class="pbox shadow" style="width:400px;height:620px"><img src="../../../../assets/product-cutouts/120qt on BB-TJB_.png" style="width:588px;left:-100px;top:-82px"></div></div>
  <div class="foot">
    <div class="brand">BUILT IN LOUISIANA</div>
    <div class="cta">Shop the 7-minute boil</div>
  </div>
  <div class="legal">Boil times vary with volume, temp and fuel pressure.</div>
</div></body></html>
