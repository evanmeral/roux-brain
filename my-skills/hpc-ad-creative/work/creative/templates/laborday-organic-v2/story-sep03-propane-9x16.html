<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1920px}
.ad{position:relative;overflow:hidden;background:#0A0908}
.bg{position:absolute;inset:0;background-image:url('../../../../assets/lifestyle/TunnelTubeBottom-BlueFlame.jpeg');
  background-size:cover;background-position:50% 40%;filter:brightness(0.86) contrast(1.04) saturate(.8)}
.scrim{position:absolute;left:0;right:0;top:24%;height:56%;z-index:2;background:linear-gradient(180deg,transparent,rgba(8,7,6,.74) 24%,rgba(8,7,6,.80) 76%,transparent)}
.vig{position:absolute;inset:0;
  background:radial-gradient(80% 54% at 50% 42%,transparent 0%,rgba(8,7,6,.58) 68%,rgba(8,7,6,.94) 100%)}
.logo{width:146px;top:262px;left:50%;transform:translateX(-50%)}
.mid{position:absolute;left:70px;right:70px;top:50%;transform:translateY(-50%);z-index:4;text-align:center}
.days{color:var(--gold);font-family:'JetBrains Mono',monospace;font-weight:800;font-size:32px;
  letter-spacing:.22em;display:block}
.hl{color:#fff;font-size:112px;font-weight:900;letter-spacing:-.045em;line-height:.94;margin-top:34px;
  text-shadow:0 6px 34px rgba(0,0,0,.62)}
.hl em{font-style:normal;color:var(--gold)}
.rule{width:112px;height:4px;background:var(--accent);border-radius:2px;margin:40px auto 0}
.sub{color:rgba(255,255,255,.9);font-size:40px;font-weight:600;margin-top:38px;line-height:1.32}
.foot{position:absolute;left:70px;right:70px;bottom:368px;z-index:4;text-align:center;
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:26px;color:#fff;letter-spacing:.16em}
.offer{position:absolute;left:50%;bottom:546px;transform:translateX(-50%);z-index:4;
  background:var(--accent);color:#fff;font-family:'JetBrains Mono',monospace;font-weight:800;
  font-size:32px;letter-spacing:.1em;padding:18px 36px;border-radius:8px;white-space:nowrap}
.foot span{display:block;color:var(--gold);font-size:25px;margin-top:16px}
.foot small{display:block;color:rgba(255,255,255,.5);font-size:21px;font-weight:700;
  letter-spacing:.14em;margin-top:22px}
</style></head>
<body><div class="ad">
  <div class="bg"></div><div class="vig"></div><div class="scrim"></div>
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="mid">
    <span class="days">FIVE DAYS LEFT</span>
    <div class="hl">Up to <em>75%</em><br>less propane.</div>
    <div class="rule"></div>
    <div class="sub">The tunnel tubes spread the burner&rsquo;s heat<br>across the whole pot bottom. Less waste.</div>
  </div>
  <div class="offer">10% OFF SITEWIDE</div>
  <div class="foot">LABORDAY10-26<span>LABORDAY30-LEGS</span><small>STACK BOTH &middot; ENDS SEPT 8</small></div>
</div></body></html>
