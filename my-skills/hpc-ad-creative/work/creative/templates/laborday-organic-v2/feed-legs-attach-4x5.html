<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1350px}
.ad{position:relative;overflow:hidden;background:var(--char)}
.glow{width:760px;height:440px;left:50%;top:44%;transform:translate(-50%,-50%);opacity:.78}
.logo{width:122px;top:52px;left:56px}
.kick{position:absolute;top:66px;right:56px;z-index:5;text-align:right;font-family:'JetBrains Mono',monospace;
  font-weight:800;font-size:24px;color:#fff;letter-spacing:.16em;line-height:1.5}
.kick span{display:block;color:var(--gold);font-size:20px}
/* stage ends at 740; copy starts at 812 — 72px of clearance, product never touches type */
.stage{position:absolute;left:0;right:0;top:112px;height:648px;z-index:4;
  display:flex;align-items:center;justify-content:center}
.pbox img{filter:drop-shadow(0 44px 64px rgba(0,0,0,.58))}
.copy{position:absolute;left:70px;right:70px;top:806px;z-index:5;text-align:center}
.hl{color:#fff;font-size:72px;font-weight:900;letter-spacing:-.038em;line-height:1.0}
.hl em{font-style:normal;color:var(--gold)}
.rule{width:92px;height:4px;background:var(--accent);border-radius:2px;margin:28px auto 0}
.sub{color:rgba(255,255,255,.84);font-size:31px;font-weight:600;margin-top:24px;line-height:1.34}
.price{display:block;margin-top:20px;font-size:40px;font-weight:800;color:#fff;letter-spacing:-.01em}
.price s{color:rgba(255,255,255,.45);font-weight:600;margin-right:14px}
.price b{color:var(--gold)}
.codes{position:absolute;left:70px;right:70px;bottom:64px;z-index:5;text-align:center;
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:27px;
  color:var(--gold);letter-spacing:.05em;line-height:1.7}
.codes span{display:block;color:rgba(255,255,255,.52);font-size:21px;letter-spacing:.14em;margin-top:12px}
</style></head>
<body><div class="ad">
  <div class="glow"></div>
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="kick">LABOR DAY<span>SEPT 1&ndash;8</span></div>
  <div class="stage">
    <div class="pbox" style="width:387px;height:628px;transform:translate(35.8px,26.5px)"><img src="../../../../assets/product-cutouts/18qt pwd on leg extensions.png" style="width:889px;left:-249px;top:-279px"></div>
  </div>
  <div class="copy">
    <div class="hl">Quit hunching<br>over the <em>pot.</em></div>
    <div class="rule"></div>
    <div class="sub">Leg extensions bring the fryer up<br>to a working height.</div>
    <div class="price"><s>$119</s><b>$83.30</b> this week</div>
  </div>
  <div class="codes">LABORDAY30-LEGS &middot; LABORDAY10-26<span>STACK BOTH ON ONE ORDER</span></div>
</div></body></html>
