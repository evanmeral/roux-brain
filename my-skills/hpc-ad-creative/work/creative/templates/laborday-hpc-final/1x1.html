<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1080px}
.ad{background:var(--flame);padding:38px 48px 0;display:flex;flex-direction:column;overflow:hidden}
.ad:after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(80% 55% at 50% 112%,rgba(0,0,0,.34),transparent 62%)}
.logo{width:130px;top:44px;right:54px}
.top{position:relative;z-index:4;flex:none}
.eyebrow{color:rgba(255,255,255,.9);font-family:'JetBrains Mono',monospace;font-weight:800;
  font-size:28px;letter-spacing:.14em}
.big{font-weight:900;font-size:112px;line-height:.9;letter-spacing:-.045em;margin-top:14px;color:#fff;white-space:nowrap}
.sub{font-weight:800;font-size:37px;color:#3A1707;margin-top:12px;letter-spacing:-.01em}
.mid{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;z-index:2}
.shadow{filter:drop-shadow(0 30px 42px rgba(0,0,0,.44))}
.offers{position:relative;z-index:5;flex:none;display:flex;gap:14px;margin-bottom:16px}
.off{flex:1;background:#141110;border-radius:9px;padding:20px 8px;text-align:center}
.off .p{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:48px;color:var(--gold);line-height:.9}
.off .t{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:21px;color:#fff;
  letter-spacing:.05em;margin-top:10px}
.codes{position:relative;z-index:5;flex:none;display:flex;gap:14px;margin-bottom:22px}
.chip{flex:1;background:#fff;border-radius:9px;padding:17px 6px;text-align:center}
.chip .k{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:33px;color:#141110;letter-spacing:-.02em}
.foot{position:relative;z-index:5;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding-bottom:24px;font-family:'JetBrains Mono',monospace;font-weight:800;letter-spacing:.06em}
.fb{font-size:22px;color:rgba(255,255,255,.85)}
.fd{font-size:27px;color:#3A1707}
</style></head>
<body><div class="ad">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="top">
    <div class="eyebrow">★ LABOR DAY SALE ★</div>
    <div class="big">FINAL DAYS.</div>
    <div class="sub">Codes expire Sept 8.</div>
  </div>
  <div class="mid"><div class="pbox shadow" style="width:464px;height:400px"><img src="../../../../assets/product-cutouts/120qt - pwd.png" style="width:658px;left:-105px;top:-62px"></div></div>
  <div class="offers">
    <div class="off"><div class="p">10%</div><div class="t">OFF SITEWIDE</div></div>
    <div class="off"><div class="p">30%</div><div class="t">OFF LEG EXT.</div></div>
  </div>
  <div class="codes">
    <div class="chip"><div class="k">LABORDAY10-26</div></div>
    <div class="chip"><div class="k">LABORDAY30-LEGS</div></div>
  </div>
  <div class="foot"><div class="fb">USE BOTH AT CHECKOUT</div><div class="fd">SEPT 1–8</div></div>
</div></body></html>
