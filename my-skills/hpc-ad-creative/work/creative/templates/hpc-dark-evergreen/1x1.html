<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1080px}
.ad{padding:38px 48px 0;display:flex;flex-direction:column}
.logo{width:130px;top:44px;right:54px}
.top{position:relative;z-index:4;flex:none}
.eyebrow{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:800;
  font-size:27px;letter-spacing:.14em}
.big{font-weight:900;font-size:172px;line-height:.80;letter-spacing:-.05em;margin-top:14px;
  background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.sw{font-weight:900;font-size:54px;color:#fff;letter-spacing:.01em;margin-top:4px}
.plus{display:inline-block;margin-top:20px;background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;
  padding:11px 22px;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:26px;letter-spacing:.04em}
.plus b{color:var(--accent)}
.glow{width:800px;height:340px;left:90px;bottom:290px;z-index:1}
.mid{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;z-index:2}
.shadow{filter:drop-shadow(0 32px 46px rgba(0,0,0,.6))}
/* orange bar + near-black type = 7.6:1. The old flame-gradient bar with white type
   measured 2.12:1 at the gold stop and 3.37:1 at the red stop — both fail. */
.bar{position:relative;z-index:5;flex:none;background:var(--accent);color:var(--ink);border-radius:9px;
  padding:16px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:27px;
  letter-spacing:.06em;margin-bottom:16px}
/* Round 3 correction (Evan, 2026-09-15): headline block above reverted to its ORIGINAL
   size — it was never too small. Only the chip text below (the actual warranty/material
   claim) needed to grow, and it's pushed well past round 2 here. */
.chips{position:relative;z-index:5;flex:none;display:flex;gap:14px;margin-bottom:22px}
.chip{flex:1;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.20);
  border-radius:9px;padding:18px 8px;text-align:center}
.chip .k{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:56px;color:#fff;letter-spacing:-.02em}
.chip .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:36px;color:var(--accent);
  letter-spacing:.01em;margin-top:10px;line-height:1.18}
.foot{position:relative;z-index:5;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding-bottom:26px;font-family:'JetBrains Mono',monospace;font-weight:800;letter-spacing:.06em}
.fb{font-size:22px;color:rgba(255,255,255,.62)}
.fd{font-size:27px;color:var(--accent)}
</style></head>
<body><div class="ad bg-dark">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="top">
    <div class="eyebrow">18 QT FISH FRYER &middot; POWERED</div>
    <div class="big">350&deg;F</div>
    <div class="sw">IN UNDER 5 MINUTES</div>
    <div class="plus">UP TO <b>75%</b> LESS PROPANE</div>
  </div>
  <div class="glow"></div>
  <div class="mid"><div class="pbox shadow" style="width:648px;height:392px;transform:translate(15px,0)"><img src="../../../../assets/product-cutouts/18qt - pwd.png" style="width:932px;left:-140px;top:-429px"></div></div>
  <div class="bar">TUNNEL TUBES ON THE POT BOTTOM</div>
  <div class="chips">
    <div class="chip"><div class="k">4MM</div><div class="v">ALUMINUM</div></div>
    <div class="chip"><div class="k">5-YR LIMITED</div><div class="v">RESIDENTIAL &middot; 120 QT &amp; SMALLER</div></div>
  </div>
  <div class="foot"><div class="fb">BUILT IN LOUISIANA</div><div class="fd">SHOP FRYERS</div></div>
</div></body></html>
