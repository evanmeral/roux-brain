<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1350px}
.ad{background:var(--navy);overflow:hidden}
.ad:before{content:"";position:absolute;inset:0;z-index:0;
  background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.13) 1.8px,transparent 1.9px);
  background-size:46px 46px}
.sheen{position:absolute;left:-10%;right:-10%;top:355px;height:250px;background:var(--flag-red);
  transform:rotate(-6deg);z-index:1}
.sheen:after{content:"";position:absolute;left:0;right:0;top:-13px;height:9px;background:#fff;opacity:.9}
.logo{width:120px;top:48px;right:60px}
.top{position:relative;z-index:4;padding:54px 64px 0}
.kick{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:19px;color:#fff;
  letter-spacing:.26em;opacity:.82}
.hl{color:#fff;font-size:96px;font-weight:900;line-height:.9;letter-spacing:-.03em;margin-top:16px}
.offer{position:absolute;left:64px;right:64px;top:390px;z-index:5;display:flex;align-items:center;gap:26px}
.opct{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:132px;color:#fff;line-height:.82;letter-spacing:-.05em}
.otxt{color:#fff;font-weight:900;font-size:40px;line-height:1.05;letter-spacing:-.02em}
.otxt span{display:block;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;
  letter-spacing:.14em;margin-top:9px;opacity:.9}
.pzone{position:absolute;left:0;right:0;top:628px;bottom:306px;z-index:3;
  display:flex;align-items:center;justify-content:center}
.shadow{filter:drop-shadow(0 30px 44px rgba(0,0,0,.55))}
.legs{position:absolute;right:48px;top:648px;z-index:6;width:250px;text-align:center;
  background:#fff;color:var(--navy);border-radius:12px;padding:20px 12px;transform:rotate(4deg);
  box-shadow:0 14px 30px rgba(0,0,0,.4)}
.legs .p{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:56px;line-height:.9;color:var(--flag-red)}
.legs .t{font-weight:800;font-size:19px;line-height:1.15;margin-top:8px}
.codes{position:absolute;left:64px;right:64px;bottom:150px;z-index:6;display:flex;gap:14px}
.chip{flex:1;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.34);
  border-radius:10px;padding:15px 8px;text-align:center}
.chip .k{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:23px;color:#fff}
.chip .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;color:#FF6478;
  letter-spacing:.13em;margin-top:7px}
.stack{position:absolute;left:64px;right:64px;bottom:96px;z-index:6;text-align:center;
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:16px;color:#FF6478;letter-spacing:.12em}
.foot{position:absolute;left:64px;right:64px;bottom:44px;z-index:6;display:flex;
  align-items:center;justify-content:space-between;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:rgba(255,255,255,.6);letter-spacing:.17em}
.foot .d{color:#FF6478;font-weight:800}
</style></head>
<body><div class="ad">
  <div class="sheen"></div>
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="top">
    <div class="kick">★ LABOR DAY SALE ★</div>
    <div class="hl">Fire it up<br>for less.</div>
  </div>
  <div class="offer">
    <div class="opct">10%</div>
    <div class="otxt">OFF<br>SITEWIDE<span>CODE · LABORDAY10-26</span></div>
  </div>
  <div class="legs"><div class="p">30%</div><div class="t">OFF LEG<br>EXTENSIONS</div></div>
  <div class="pzone"><div class="pbox shadow" style="width:284px;height:462px"><img src="../../../../assets/product-cutouts/18qt pwd on leg extensions.png" style="width:654px;left:-183px;top:-205px"></div></div>
  <div class="codes">
    <div class="chip"><div class="k">LABORDAY10-26</div><div class="v">10% OFF SITEWIDE</div></div>
    <div class="chip"><div class="k">LABORDAY30-LEGS</div><div class="v">30% OFF LEG EXT.</div></div>
  </div>
  <div class="stack">STACK BOTH CODES AT CHECKOUT</div>
  <div class="foot"><div>HIGH PERFORMANCE COOKERS · BUILT IN LOUISIANA</div><div class="d">SEPT 1–8</div></div>
</div></body></html>
