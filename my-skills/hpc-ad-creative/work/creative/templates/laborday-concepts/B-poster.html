<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1350px}
.ad{background:var(--cream);padding:20px}
.frame{position:relative;height:100%;border:7px solid var(--navy);border-radius:4px;
  padding:40px 54px 0;display:flex;flex-direction:column;overflow:hidden}
.frame:before{content:"";position:absolute;inset:14px;border:2px solid var(--flag-red);border-radius:2px;pointer-events:none}
.top{position:relative;z-index:3;text-align:center}
.stars{font-size:20px;color:var(--flag-red);letter-spacing:.5em;margin-left:.5em}
.kick{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:19px;color:var(--navy);
  letter-spacing:.3em;margin-top:12px}
.big{font-weight:900;font-size:158px;line-height:.8;color:var(--flag-red);letter-spacing:-.05em;margin-top:12px}
.sw{font-weight:900;font-size:56px;color:var(--navy);letter-spacing:.02em;margin-top:6px}
.rule{height:4px;background:var(--navy);margin:20px 210px 0;border-radius:2px}
.mid{position:relative;flex:1;display:flex;align-items:center;justify-content:center;z-index:2;padding:4px 0 0}
.shadow{filter:drop-shadow(0 24px 32px rgba(0,0,0,.28))}
.burst{position:absolute;left:16px;top:520px;width:224px;height:224px;z-index:4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:var(--navy);color:#fff;border-radius:50%;transform:rotate(-8deg);
  box-shadow:0 12px 26px rgba(0,0,0,.28);border:4px solid var(--cream)}
.burst .p{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:62px;line-height:.9;color:#FF6478}
.burst .t{font-weight:800;font-size:20px;line-height:1.15;margin-top:8px;letter-spacing:-.01em}
.codes{position:relative;z-index:3;display:flex;gap:14px;margin-bottom:20px}
.chip{flex:1;background:var(--navy);color:#fff;border-radius:8px;padding:16px 8px;text-align:center}
.chip .k{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:23px;letter-spacing:.01em}
.chip .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;color:#FF6478;
  letter-spacing:.13em;margin-top:8px}
.bar{position:relative;z-index:3;background:var(--flag-red);color:#fff;border-radius:8px;
  padding:15px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:17px;
  letter-spacing:.12em;margin-bottom:18px}
.foot{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;
  padding-bottom:26px}
.logo{width:96px;position:relative;top:auto;left:auto}
.fdate{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:16px;color:var(--navy);letter-spacing:.16em}
</style></head>
<body><div class="ad"><div class="frame">
  <div class="burst"><div class="p">30%</div><div class="t">OFF LEG<br>EXTENSIONS</div></div>
  <div class="top">
    <div class="stars">★★★★★</div>
    <div class="kick">LABOR DAY SALE</div>
    <div class="big">10% OFF</div>
    <div class="sw">SITEWIDE</div>
  </div>
  <div class="mid"><div class="pbox shadow" style="width:380px;height:618px"><img src="../../../../assets/product-cutouts/18qt pwd on leg extensions.png" style="width:875px;left:-245px;top:-274px"></div></div>
  <div class="bar">STACK BOTH CODES AT CHECKOUT</div>
  <div class="codes">
    <div class="chip"><div class="k">LABORDAY10-26</div><div class="v">10% OFF SITEWIDE</div></div>
    <div class="chip"><div class="k">LABORDAY30-LEGS</div><div class="v">30% OFF LEG EXT.</div></div>
  </div>
  <div class="foot">
    <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-Black.png">
    <div class="fdate">SEPT 1–8, 2026</div>
  </div>
</div></div></body></html>
