<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1200px;height:628px}
.ad{padding:40px 44px 0}
.logo{width:92px;top:36px;right:44px}
.body{position:relative;z-index:4;display:flex;align-items:center;gap:24px;height:492px}
.col{width:660px;flex:none}
/* Round 4 (Evan + Jay, 2026-09-15): top line turned into a real headline, matching the
   1x1/9x16 treatment — same words, bold, 2-line, orange accent on the second line. */
.headline{font-weight:800;letter-spacing:-.02em;line-height:.96;font-size:50px;color:#fff;margin-bottom:14px}
.headline .accent{background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.math{display:flex;flex-direction:column}
.row{display:flex;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.16)}
.row:first-child{border-top:1px solid rgba(255,255,255,.16)}
.num{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:58px;color:#fff;line-height:.86;
  letter-spacing:-.05em;width:148px;flex:none}
.num.o{background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
/* Round 3 correction (Evan, 2026-09-15): number reverted to ORIGINAL size; this caption
   is the smaller supporting copy, pushed well past round 2's 21px. */
.lab{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:28px;white-space:nowrap;
  color:rgba(255,255,255,.86);letter-spacing:0;text-transform:uppercase;line-height:1.2}
.hl{color:#fff;font-size:36px;margin-top:24px}
.sub{color:rgba(255,255,255,.72);font-size:19px;margin-top:10px}
.pcol{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;height:100%}
.glow{width:540px;height:340px;left:50%;top:50%;transform:translate(-50%,-26%);z-index:1}
.shadow{position:relative;z-index:2;filter:drop-shadow(0 28px 42px rgba(0,0,0,.55))}
.foot{position:absolute;left:44px;right:44px;bottom:34px;z-index:5;
  display:flex;align-items:center;justify-content:flex-end}
.cta{font-size:19px}
</style></head>
<body><div class="ad bg-dark">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="body">
    <div class="col">
      <div class="headline">120 QT<br><span class="accent">Powered Cooker.</span></div>
      <div class="math">
        <div class="row"><div class="num o">2</div><div class="lab">Sacks of crawfish</div></div>
        <div class="row"><div class="num">40+</div><div class="lab">People fed</div></div>
        <div class="row"><div class="num">1</div><div class="lab">Pot</div></div>
      </div>
      <div class="hl">Do the math once.</div>
      <div class="sub">~70 lbs, ~16 gallons, one rolling boil. Then do it again.</div>
    </div>
    <div class="pcol">
      <div class="glow"></div>
      <div class="pbox shadow" style="width:464px;height:400px"><img src="../../../../assets/product-cutouts/120qt - pwd.png" style="width:658px;left:-105px;top:-62px"></div>
    </div>
  </div>
  <!-- HPC logo already sits top-right of this ad, so the wordmark line is dropped
       entirely per Evan, 2026-09-15 — just the CTA remains in the footer. -->
  <div class="foot">
    <div class="cta">Build your rig</div>
  </div>
</div></body></html>
