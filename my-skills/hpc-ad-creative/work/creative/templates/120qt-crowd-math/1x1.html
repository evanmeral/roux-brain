<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1080px}
.ad{padding:56px 56px 0}
.logo{width:112px;top:52px;right:56px}
.body{position:relative;z-index:4;display:flex;align-items:center;gap:26px;height:900px}
.col{width:520px;flex:none}
/* Round 4 (Evan + Jay, 2026-09-15): the top line was a small eyebrow label and the ad
   read as headline-less. Turned it into an actual headline — same words, styled like
   rolling-boil's "Cold water to a rolling boil." treatment (big, bold, 2-line, orange
   accent on the second line) so this ad opens with a real headline instead of a caption.
   Column widened 470->520 and the product trimmed to match so the bigger type has room. */
.headline{font-weight:800;letter-spacing:-.02em;line-height:.96;font-size:60px;color:#fff;margin-bottom:22px}
.headline .accent{background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.math{display:flex;flex-direction:column}
.row{display:flex;align-items:center;padding:22px 0;border-bottom:1px solid rgba(255,255,255,.16)}
.row:first-child{border-top:1px solid rgba(255,255,255,.16)}
.num{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:86px;color:#fff;line-height:.86;
  letter-spacing:-.05em;width:176px;flex:none}
.num.o{background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
/* Round 3 correction (Evan, 2026-09-15): the big number reverted to ORIGINAL size —
   headline-tier text was fine as it was. This caption is the smaller supporting copy,
   pushed well past round 2; "Sacks of crawfish" wraps to 2 lines at this size, which
   is fine — the other two rows stay on one line regardless. */
.lab{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;
  color:rgba(255,255,255,.86);letter-spacing:.02em;text-transform:uppercase;line-height:1.2}
.hl{color:#fff;font-size:52px;margin-top:34px}
.sub{color:rgba(255,255,255,.72);font-size:21px;margin-top:16px}
.pcol{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;height:100%}
.glow{width:640px;height:400px;left:50%;top:50%;transform:translate(-50%,-30%);z-index:1}
.shadow{position:relative;z-index:2;filter:drop-shadow(0 34px 50px rgba(0,0,0,.55))}
.footwrap{position:absolute;left:56px;right:56px;bottom:46px;z-index:5;
  display:flex;align-items:center;justify-content:flex-end}
.cta{font-size:24px}
</style></head>
<body><div class="ad bg-dark">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="body">
    <div class="col">
      <div class="headline">120 QT<br><span class="accent">Powered Cooker.</span></div>
      <div class="math">
        <div class="row"><div class="num o">2</div><div class="lab">Sacks of crawfish</div></div>
        <div class="row"><div class="num">40+</div><div class="lab">People fed</div></div>
        <div class="row"><div class="num">1</div><div class="lab">Pot</div></div>
      </div>
      <div class="hl">Do the math once.</div>
      <div class="sub">~70 lbs, ~16 gallons, one rolling boil. Then do it again.</div>
    </div>
    <div class="pcol">
      <div class="glow"></div>
      <div class="pbox shadow" style="width:422px;height:363px"><img src="../../../../assets/product-cutouts/120qt - pwd.png" style="width:598px;left:-95px;top:-56px"></div>
    </div>
  </div>
  <!-- HPC logo already sits top-right of this ad, so the wordmark line is dropped
       entirely per Evan, 2026-09-15 — just the CTA remains in the footer. -->
  <div class="footwrap">
    <div class="cta">Build your rig</div>
  </div>
</div></body></html>
