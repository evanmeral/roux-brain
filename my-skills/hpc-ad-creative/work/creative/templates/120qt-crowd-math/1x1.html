<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1080px}
.ad{padding:56px 56px 0}
.logo{width:112px;top:52px;right:56px}
.body{position:relative;z-index:4;display:flex;align-items:center;gap:26px;height:900px}
.col{width:470px;flex:none}
.eyebrow{color:var(--accent);font-size:24px;margin-bottom:28px}
.math{display:flex;flex-direction:column}
.row{display:flex;align-items:center;padding:22px 0;border-bottom:1px solid rgba(255,255,255,.16)}
.row:first-child{border-top:1px solid rgba(255,255,255,.16)}
.num{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:86px;color:#fff;line-height:.86;
  letter-spacing:-.05em;width:176px;flex:none}
.num.o{background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.lab{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;
  color:rgba(255,255,255,.82);letter-spacing:.13em;text-transform:uppercase;line-height:1.2}
.hl{color:#fff;font-size:52px;margin-top:34px}
.sub{color:rgba(255,255,255,.7);font-size:21px;margin-top:16px}
.pcol{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;height:100%}
.glow{width:640px;height:400px;left:50%;top:50%;transform:translate(-50%,-30%);z-index:1}
.shadow{position:relative;z-index:2;filter:drop-shadow(0 34px 50px rgba(0,0,0,.55))}
.foot{position:absolute;left:56px;right:56px;bottom:46px;z-index:5;
  display:flex;align-items:center;justify-content:space-between}
.cta{font-size:24px}
.brand{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:rgba(255,255,255,.6);
  letter-spacing:.18em}
</style></head>
<body><div class="ad bg-dark">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="body">
    <div class="col">
      <div class="eyebrow">120 QT Powered Cooker</div>
      <div class="math">
        <div class="row"><div class="num o">2</div><div class="lab">Sacks of crawfish</div></div>
        <div class="row"><div class="num">40+</div><div class="lab">People fed</div></div>
        <div class="row"><div class="num">1</div><div class="lab">Pot</div></div>
      </div>
      <div class="hl">Do the math once.</div>
      <div class="sub">~70 lbs, ~16 gallons, one rolling boil. Then do it again.</div>
    </div>
    <div class="pcol">
      <div class="glow"></div>
      <div class="pbox shadow" style="width:460px;height:396px"><img src="../../../../assets/product-cutouts/120qt - pwd.png" style="width:652px;left:-104px;top:-61px"></div>
    </div>
  </div>
  <div class="foot">
    <div class="brand">HIGH PERFORMANCE COOKERS &middot; COVINGTON, LA</div>
    <div class="cta">Build your rig</div>
  </div>
</div></body></html>
