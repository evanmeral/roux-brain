<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1920px}
.ad{padding:0}
.inner{position:absolute;left:80px;right:80px;top:376px;z-index:4}
/* Round 4 (Evan + Jay, 2026-09-15): top line turned into a real headline — same words,
   styled like rolling-boil's big bold 2-line treatment with an orange accent, so the ad
   opens with a headline instead of a caption. Product trimmed ~9% and pzone pushed down
   to make room, same as the round-3 evergreen fix. */
.headline{font-weight:800;letter-spacing:-.02em;line-height:.96;font-size:76px;color:#fff;margin-bottom:30px}
.headline .accent{background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.math{display:flex;flex-direction:column;margin-top:6px}
.row{display:flex;align-items:center;gap:0;padding:24px 0;
  border-bottom:1px solid rgba(255,255,255,.16)}
.row:first-child{border-top:1px solid rgba(255,255,255,.16)}
.num{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:104px;color:#fff;line-height:.86;
  letter-spacing:-.05em;width:268px;flex:none}
.num.o{background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
/* Round 3 correction (Evan, 2026-09-15): number reverted to ORIGINAL size; this caption
   is the smaller supporting copy, pushed well past round 2. */
.lab{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:40px;white-space:nowrap;
  color:rgba(255,255,255,.86);letter-spacing:.01em;text-transform:uppercase;line-height:1.1}
.hl{color:#fff;font-size:56px;margin-top:44px}
.sub{color:rgba(255,255,255,.72);font-size:27px;margin-top:20px;max-width:780px}
.glow{width:980px;height:540px;left:50px;bottom:250px;z-index:1}
.pzone{position:absolute;left:0;right:0;top:1168px;bottom:322px;z-index:2;
  display:flex;align-items:center;justify-content:center}
.shadow{filter:drop-shadow(0 34px 50px rgba(0,0,0,.55))}
.foot{position:absolute;left:80px;right:80px;bottom:150px;z-index:5;text-align:center}
.logo{width:190px;top:150px;left:50%;transform:translateX(-50%)}
.cta{font-size:30px;padding:.85em 2.2em}
</style></head>
<body><div class="ad bg-dark">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="glow"></div>
  <div class="pzone"><div class="pbox shadow" style="width:499px;height:430px"><img src="../../../../assets/product-cutouts/120qt - pwd.png" style="width:707px;left:-113px;top:-66px"></div></div>
  <div class="inner">
    <div class="headline">120 QT<br><span class="accent">Powered Cooker.</span></div>
    <div class="math">
      <div class="row"><div class="num o">2</div><div class="lab">Sacks of crawfish</div></div>
      <div class="row"><div class="num">40+</div><div class="lab">People fed</div></div>
      <div class="row"><div class="num">1</div><div class="lab">Pot</div></div>
    </div>
    <div class="hl">Do the math once.</div>
    <div class="sub">~70 lbs, ~16 gallons, one rolling boil. Then do it again.</div>
  </div>
  <!-- HPC logo already appears above this ad, so the wordmark line is dropped
       entirely per Evan, 2026-09-15 — just the CTA remains in the footer. -->
  <div class="foot">
    <div class="cta">Build your rig</div>
  </div>
</div></body></html>
