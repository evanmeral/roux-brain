<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1350px}
.ad{background:var(--cream);padding:20px}
.frame{position:relative;height:100%;border:8px solid var(--navy);border-radius:4px;
  padding:34px 46px 0;display:flex;flex-direction:column;overflow:hidden}
.frame:before{content:"";position:absolute;inset:15px;border:3px solid var(--flag-red);border-radius:2px;pointer-events:none}
.top{position:relative;z-index:3;text-align:center;flex:none}
.kick{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:32px;color:var(--navy);letter-spacing:.2em}
.kick i{font-style:normal;color:var(--flag-red)}
.big{font-weight:900;font-size:166px;line-height:.78;color:var(--flag-red);letter-spacing:-.05em;margin-top:14px}
.sw{font-weight:900;font-size:62px;color:var(--navy);letter-spacing:.01em;margin-top:6px}
.plus{display:inline-block;margin-top:18px;background:var(--navy);color:#fff;border-radius:8px;
  padding:12px 26px;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:29px;letter-spacing:.05em}
.plus b{color:#FF6478}
.mid{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;
  justify-content:space-between;gap:8px;z-index:2;padding:6px 0}
.cell{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pwrap{height:330px;display:flex;align-items:center;justify-content:center}
.shadow{filter:drop-shadow(0 20px 28px rgba(0,0,0,.26))}
.pname{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:31px;color:var(--navy);
  letter-spacing:.03em;text-align:center;margin-top:20px;line-height:1.3}
.pname span{display:block;color:var(--flag-red);font-size:26px;margin-top:6px}
.vline{width:2px;align-self:stretch;background:rgba(14,39,72,.14);margin:34px 0}
.bar{position:relative;z-index:3;flex:none;background:var(--flag-red);color:#fff;border-radius:8px;
  padding:18px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:32px;
  letter-spacing:.06em;margin-bottom:16px}
.codes{position:relative;z-index:3;flex:none;display:flex;gap:14px;margin-bottom:20px}
.chip{flex:1;background:var(--navy);color:#fff;border-radius:8px;padding:18px 6px;text-align:center}
.chip .k{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:40px;letter-spacing:-.02em}
.chip .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:24px;color:#FF6478;
  letter-spacing:.06em;margin-top:10px}
.foot{position:relative;z-index:3;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding-bottom:24px}
.logo{width:112px;position:relative;top:auto;left:auto;right:auto}
.fdate{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:32px;color:var(--navy);letter-spacing:.06em}
</style></head>
<body><div class="ad"><div class="frame">
  <div class="top">
    <div class="kick"><i>★</i> LABOR DAY SALE <i>★</i></div>
    <div class="big">10% OFF</div>
    <div class="sw">EVERYTHING</div>
    <div class="plus">PLUS <b>30% OFF</b> LEG EXTENSIONS</div>
  </div>
  <div class="mid">
    <div class="cell"><div class="pwrap"><div class="pbox shadow" style="width:392px;height:338px"><img src="../../../../assets/product-cutouts/120qt - pwd.png" style="width:556px;left:-89px;top:-52px"></div></div><div class="pname">120 QT<span>POWERED COOKER</span></div></div>
    <div class="vline"></div>
    <div class="cell"><div class="pwrap"><div class="pbox shadow" style="width:392px;height:237px"><img src="../../../../assets/product-cutouts/18qt - pwd.png" style="width:564px;left:-85px;top:-259px"></div></div><div class="pname">18 QT<span>FISH FRYER</span></div></div>
  </div>
  <div class="bar">USE BOTH CODES AT CHECKOUT</div>
  <div class="codes">
    <div class="chip"><div class="k">LABORDAY10-26</div><div class="v">10% OFF SITEWIDE</div></div>
    <div class="chip"><div class="k">LABORDAY30-LEGS</div><div class="v">30% OFF LEGS</div></div>
  </div>
  <div class="foot">
    <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-Black.png">
    <div class="fdate">SEPT 1–8</div>
  </div>
</div></div></body></html>
