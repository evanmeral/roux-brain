<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../brand.css">
<style>
html,body{width:1080px;height:1350px}
.ad{position:relative;overflow:hidden;background:#111}
.bg{position:absolute;inset:0;background-image:url('../../../../assets/lifestyle/120qt-with-steam.png');
  background-size:cover;background-position:56% 38%}
.scrim{position:absolute;left:0;right:0;bottom:0;height:74%;
  background:linear-gradient(180deg,rgba(10,9,8,0) 0%,rgba(10,9,8,.42) 30%,rgba(10,9,8,.82) 56%,rgba(10,9,8,.96) 100%)}
.toptint{position:absolute;left:0;right:0;top:0;height:26%;
  background:linear-gradient(180deg,rgba(10,9,8,.55),transparent)}
.logo{width:150px;top:52px;right:56px}
.eyebrow{position:absolute;top:62px;left:62px;z-index:4;color:#fff;
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:30px;letter-spacing:.16em;
  text-shadow:0 2px 14px rgba(0,0,0,.7)}
.copy{position:absolute;left:62px;right:62px;bottom:210px;z-index:4}
.hl{color:#fff;font-size:104px;font-weight:900;letter-spacing:-.03em;line-height:.94;
  text-shadow:0 4px 26px rgba(0,0,0,.55)}
.hl em{font-style:normal;background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:rgba(255,255,255,.92);font-size:31px;font-weight:500;line-height:1.36;margin-top:26px;max-width:800px;
  text-shadow:0 2px 14px rgba(0,0,0,.6)}
.specs{position:absolute;left:62px;right:62px;bottom:112px;z-index:4;display:flex;gap:0;
  border-top:1px solid rgba(255,255,255,.28);padding-top:22px}
.spec{flex:1;border-right:1px solid rgba(255,255,255,.28);text-align:center;padding:0 10px}
.spec:last-child{border-right:0}
.spec .n{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:40px;color:#fff;line-height:1}
.spec .n i{font-style:normal;font-size:22px;color:var(--accent);margin-right:5px}
.spec .n em{font-style:normal;font-size:23px;color:var(--accent)}
.spec .l{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px;
  color:rgba(255,255,255,.66);letter-spacing:.11em;margin-top:11px}
.legal{position:absolute;left:62px;right:62px;bottom:56px;z-index:4;text-align:center;
  font-family:'JetBrains Mono',monospace;font-weight:500;font-size:19px;color:rgba(255,255,255,.55)}
</style></head>
<body><div class="ad">
  <div class="bg"></div><div class="toptint"></div><div class="scrim"></div>
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-White.png">
  <div class="eyebrow">HOME OF THE 7 MINUTE BOIL</div>
  <div class="copy">
    <div class="hl">Cold water to a<br><em>rolling boil.</em></div>
    <div class="sub">Tunnel Tube technology is in the pot — so it works on any burner you already own.</div>
  </div>
  <div class="specs">
    <div class="spec"><div class="n">6.5–7<em>min</em></div><div class="l">TO A ROLLING BOIL</div></div>
    <div class="spec"><div class="n">~90<em>sec</em></div><div class="l">RECOVERY</div></div>
    <div class="spec"><div class="n"><i>up to</i>75<em>%</em></div><div class="l">LESS PROPANE</div></div>
  </div>
  <div class="legal">Boil times vary with volume, ambient temperature and fuel pressure.</div>
</div></body></html>
