<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../brand.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Direction A: THE PAIRING, cream backdrop (Evan chose it 2026-09-18 over orange, rust and navy; those are in drafts/pot-tjb-pair/_scrapped/). Coloured shield kept.
   Direction A: THE PAIRING. Pot + burner as an equation on a solid flame-orange field.
   Archivo Black, black type, no dark stage: the opposite of the last three pot ads. */
body{width:1080px;height:1080px}
:root{--nx:43px;--bg:#F3E9D8;--ink:#161311;--hi:#D9661A;--plus:#D9661A;--acc:#F69329;--ctaink:#111;--bar:#161311;--shadow:rgba(70,45,20,.38)}
.ad{background:var(--bg);color:var(--ink);font-family:'Archivo',sans-serif}
.logo{top:52px;right:56px;width:150px}
.head{position:absolute;left:60px;top:58px;width:760px}
.hl{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:104px;line-height:.92;letter-spacing:-.035em}
.hl span{color:var(--hi)}
.sub{margin-top:24px;font-size:38px;line-height:1.2;font-weight:700;opacity:1}
.stage{position:absolute;left:0;right:0;top:330px;height:470px;display:flex;align-items:flex-end;justify-content:center;gap:0}
.item{display:flex;flex-direction:column;align-items:center}
.pbox{overflow:visible;filter:drop-shadow(0 26px 22px var(--shadow))}
.plus{font-family:'Archivo Black';font-size:104px;line-height:1;color:var(--plus);align-self:center;margin:0 10px 60px}
.lab{margin-top:18px;font-weight:800;font-size:31px;letter-spacing:.04em;text-transform:uppercase;text-align:center;line-height:1.05}
.bar{position:absolute;left:0;right:0;bottom:0;height:200px;background:var(--bar);color:#fff;padding:30px 60px 0;display:flex;justify-content:space-between;align-items:flex-start}
.stats{font-weight:800;font-size:36px;line-height:1.2}
.stats b{color:var(--acc)}
.cta{background:var(--acc);color:var(--ctaink);font-family:'Archivo Black';font-weight:400;font-size:36px;padding:22px 34px;border-radius:10px;margin-top:6px}
.fine{position:absolute;left:60px;bottom:22px;font-family:'Archivo';font-weight:600;font-size:22px;color:rgba(255,255,255,.72)}
</style></head><body>
<div class="ad">
  <img class="logo" src="../../../../assets/brand-refs/HPC-ShieldLogo-Color.png">
  <div class="head">
    <div class="hl">The fast part<br><span>is the pot.</span></div>
    <div class="sub">Tunnel Tubes on the bottom.<br>A Boil Boss Triple Jet underneath.</div>
  </div>
  <div class="stage" style="transform:translateX(var(--nx,0px))">
    <div class="item">
      <div class="pbox" style="width:445px;height:336px"><img src="../../../../assets/product-cutouts/100-120qt - perf.png" style="width:638px;left:-97px;top:-259px"></div>
    </div>
    <div class="plus">+</div>
    <div class="item">
      <div class="pbox" style="width:380px;height:318px"><img src="../../../../assets/product-cutouts/updated-2026-09/Boilboss TJB - with centering brackets, three-quarter.png" style="width:547px;left:-83px;top:-205px"></div>
    </div>
  </div>
  <div class="bar">
    <div class="stats">Rolling boil in as little as <b>7 min</b><br>Up to <b>75% less</b> propane</div>
    <div class="cta">Pair them up</div>
    <div class="fine">Times vary with volume, ambient temperature and fuel pressure.</div>
  </div>
</div>
</body></html>
