<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROUX</title>
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="/logo.png" alt="HPC" class="shield">
    <span class="wordmark">ROUX</span>
    <nav class="tabs" id="tabs"><button class="tab is-on" data-tab="today">Today</button><button class="tab" data-tab="launches">Launches</button><button class="tab" data-tab="approvals">Approvals<span class="tab-n is-hidden" id="tab-approvals-n"></span></button><button class="tab" data-tab="affiliates">Affiliates</button><button class="tab" data-tab="score">Score</button><button class="tab" data-tab="board">Board</button><button class="tab" data-tab="files">Files</button></nav>
  </div>
  <div class="clock">
    <div class="time" id="clock-time">--:--</div>
    <div class="date mono" id="clock-date">—</div>
  </div>
  <div class="chips" id="countdowns"></div>
</header>

<main class="grid view is-on" id="view-today">
  <div class="desk-strip" id="desk-strip"></div>
  <section class="col">
    <article class="panel panel-morning" id="panel-morning">
      <header class="panel-head"><span class="eyebrow">This morning</span><span class="head-right"><span class="mono stamp" id="morning-stamp"></span><span class="mono stamp" id="routine-status"></span><button class="btn btn-sm" id="pulse-btn" title="Run the morning pulse now (reads only, a minute or two)">Pulse now</button></span></header>
      <div class="panel-body" id="morning-body"></div>
    </article>

    <article class="panel" id="panel-now">
      <header class="panel-head"><span class="eyebrow">Now</span><span class="mono stamp" id="board-stamp"></span></header>
      <div class="panel-body" id="now-body"></div>
    </article>

    <article class="panel" id="panel-waiting">
      <header class="panel-head"><span class="eyebrow">Waiting on you</span><button class="ghost mono" id="others-toggle"></button></header>
      <div class="panel-body" id="waiting-body"></div>
      <div class="panel-body others" id="others-body"></div>
    </article>
  </section>

  <section class="col">
    <article class="panel panel-week" id="panel-week">
      <header class="panel-head"><span class="eyebrow">This week</span><span class="mono stamp" id="week-stamp"></span></header>
      <div class="week" id="week-body"></div>
    </article>

    <article class="panel" id="panel-running">
      <header class="panel-head"><span class="eyebrow">Running</span><span class="mono stamp" id="cap-stamp"></span></header>
      <div class="panel-body" id="running-body"></div>
    </article>

    <article class="panel" id="panel-roux">
      <header class="panel-head"><span class="eyebrow">Tell ROUX</span><span class="mono stamp" id="capture-stamp"></span></header>
      <form class="capture" id="capture-form">
        <input type="text" id="capture-text" placeholder="Something the brain should know next session" autocomplete="off">
        <button type="submit" class="btn">Save</button>
        <button type="button" class="btn" id="ask-btn" title="Open a Claude session with this as the first message">Ask</button>
      </form>
      <div class="starts">
        <button class="btn is-primary" data-session="/morning-brief">Morning brief</button>
        <button class="btn" data-session="/sort-my-inbox">Sort inbox</button>
        <span class="mono stamp" id="session-status"></span>
      </div>
    </article>

    <article class="panel" id="panel-recent">
      <header class="panel-head"><span class="eyebrow">Made recently</span><span class="mono stamp">opens in Obsidian</span></header>
      <div class="panel-body recent" id="recent-body"></div>
    </article>

    <div class="links" id="links"></div>
  </section>
</main>

<main class="view board" id="view-board">
  <div class="board-grid" id="board-body"></div>
</main>

<main class="view board" id="view-launches">
  <div class="board-grid" id="launches-body"></div>
</main>

<main class="view board" id="view-approvals">
  <div class="board-grid" id="approvals-body"></div>
</main>

<main class="view board" id="view-score">
  <div class="board-grid" id="score-body"></div>
</main>

<main class="view affiliates" id="view-affiliates">
  <div id="aff-head"></div>
  <div id="aff-body"></div>
  <div class="aff-shade" id="aff-shade"></div>
  <aside class="aff-drawer" id="aff-drawer" aria-label="Affiliate details"></aside>
</main>

<main class="view files" id="view-files">
  <div class="files-left">
    <input type="search" id="files-q" placeholder="Search the vault: a word from the file name or folder" autocomplete="off">
    <div class="mono stamp" id="files-count"></div>
    <div id="files-list"></div>
  </div>
  <div class="files-right panel" id="files-preview"><div class="empty">Pick a file to preview it here. Open in Obsidian or copy the path from the top of the preview.</div></div>
</main>

<footer class="status mono" id="status"></footer>
<script src="/affiliates.js"></script>
<script src="/launches.js"></script>
<script src="/approvals.js"></script>
<script src="/score.js"></script>
<script src="/app.js"></script>
</body>
</html>
